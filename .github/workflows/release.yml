name: Build Private, Publish Public Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing tag to republish (format: vX.Y.Z)"
        required: false
        type: string

permissions:
  contents: read

env:
  PUBLIC_OWNER: KNULL-AI
  PUBLIC_REPO: KNULLS-QD-Releases

jobs:
  build-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: electron:build:win
            artifact_name: win-assets
            artifact_paths: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            build_script: electron:build:mac
            artifact_name: mac-assets
            artifact_paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.dmg.blockmap
              dist/*.zip.blockmap
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure pushed tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagName = "${{ github.ref_name }}"
          if ($tagName -ne "v$pkgVersion") {
            Write-Error "Tag $tagName does not match package.json version v$pkgVersion"
          }

      - name: Build release assets only (no publish)
        run: npm run ${{ matrix.build_script }} -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-public-release:
    needs: build-assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
    steps:
      - name: Validate publishing token exists
        shell: bash
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing PUBLIC_RELEASES_TOKEN secret in private repo settings."
            exit 1
          fi

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${{ github.event.inputs.tag }}"
            if [ -z "${TAG_NAME}" ]; then
              echo "For manual runs, provide the tag input (example: v1.0.20)."
              exit 1
            fi
          fi

          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: ${TAG_NAME}. Expected vX.Y.Z"
            exit 1
          fi

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Ensure latest.yml asset path exists
        shell: bash
        run: |
          LATEST_FILE="$(find release-assets -type f -name latest.yml | head -n 1)"
          if [ -z "${LATEST_FILE}" ]; then
            echo "No latest.yml found in downloaded artifacts."
            exit 1
          fi

          WIN_DIR="$(dirname "${LATEST_FILE}")"
          EXPECTED_PATH="$(awk '/^path:/{print $2; exit}' "${LATEST_FILE}")"

          if [ -z "${EXPECTED_PATH}" ]; then
            echo "Could not parse Windows path from latest.yml"
            exit 1
          fi

          if [ ! -f "${WIN_DIR}/${EXPECTED_PATH}" ]; then
            DOTTED_CANDIDATE="${EXPECTED_PATH//-/.}"
            if [ -f "${WIN_DIR}/${DOTTED_CANDIDATE}" ]; then
              cp "${WIN_DIR}/${DOTTED_CANDIDATE}" "${WIN_DIR}/${EXPECTED_PATH}"
              echo "Created alias: ${EXPECTED_PATH} <- ${DOTTED_CANDIDATE}"
            else
              echo "Missing expected Windows asset '${EXPECTED_PATH}' and dotted fallback '${DOTTED_CANDIDATE}'."
              exit 1
            fi
          fi

          if [ ! -f "${WIN_DIR}/${EXPECTED_PATH}.blockmap" ]; then
            DOTTED_BLOCKMAP="${EXPECTED_PATH//-/.}.blockmap"
            if [ -f "${WIN_DIR}/${DOTTED_BLOCKMAP}" ]; then
              cp "${WIN_DIR}/${DOTTED_BLOCKMAP}" "${WIN_DIR}/${EXPECTED_PATH}.blockmap"
              echo "Created alias: ${EXPECTED_PATH}.blockmap <- ${DOTTED_BLOCKMAP}"
            else
              echo "Warning: blockmap alias not created (missing ${EXPECTED_PATH}.blockmap and ${DOTTED_BLOCKMAP})"
            fi
          fi

      - name: Create or update public release metadata
        shell: bash
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag }}"
          TARGET_REPO="${PUBLIC_OWNER}/${PUBLIC_REPO}"

          if gh release view "${TAG_NAME}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --repo "${TARGET_REPO}" --latest --title "${TAG_NAME}" --prerelease=false
          else
            gh release create "${TAG_NAME}" --repo "${TARGET_REPO}" --title "${TAG_NAME}" --notes "Automated public artifact release for ${TAG_NAME}" --latest
          fi

      - name: Upload assets to public release
        shell: bash
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag }}"
          TARGET_REPO="${PUBLIC_OWNER}/${PUBLIC_REPO}"
          shopt -s nullglob
          FILES=(release-assets/**/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release assets found to upload."
            exit 1
          fi
          gh release upload "${TAG_NAME}" "${FILES[@]}" --repo "${TARGET_REPO}" --clobber
