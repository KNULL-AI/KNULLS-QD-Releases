name: Publish Public Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.repository == 'KNULL-AI/KNULLS-QD-Releases'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: electron:build:win
            artifact_name: windows-release-artifacts
            artifact_paths: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            build_script: electron:build:mac
            artifact_name: macos-release-artifacts
            artifact_paths: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagName = "${{ github.ref_name }}"
          if ($tagName -ne "v$pkgVersion") {
            Write-Error "Tag $tagName does not match package.json version v$pkgVersion"
          }

      - name: Build and publish to public releases repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ${{ matrix.build_script }} -- --publish always

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: ignore

  finalize-release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'KNULL-AI/KNULLS-QD-Releases'
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish release and mark latest
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tagName = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: 'KNULL-AI',
              repo: 'KNULLS-QD-Releases',
              tag: tagName,
            });

            await github.rest.repos.updateRelease({
              owner: 'KNULL-AI',
              repo: 'KNULLS-QD-Releases',
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
              name: tagName,
            });
