name: Publish Public Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagName = "${{ github.ref_name }}"
          if ($tagName -ne "v$pkgVersion") {
            Write-Error "Tag $tagName does not match package.json version v$pkgVersion"
          }

      - name: Build and publish to public releases repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run electron:build -- --publish always

      - name: Publish release and mark latest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "knulls-qd-release-workflow"
          }

          $tagName = "${{ github.ref_name }}"
          $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/KNULL-AI/KNULLS-QD-Releases/releases/tags/$tagName"

          $body = @{
            draft = $false
            prerelease = $false
            make_latest = "true"
            name = $tagName
          } | ConvertTo-Json

          Invoke-RestMethod -Method Patch -Headers $headers -ContentType "application/json" -Body $body "https://api.github.com/repos/KNULL-AI/KNULLS-QD-Releases/releases/$($release.id)"

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: ignore
